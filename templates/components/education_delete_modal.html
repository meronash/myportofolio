<div id="delete-education-modal"
     class="education-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title">
    
    <button type="button"
            class="education-delete-modal__backdrop"
            popovertarget="delete-education-modal"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    
    <div class="education-delete-modal__content">
        <button type="button"
                class="education-delete-modal__close"
                popovertarget="delete-education-modal"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        
        <h2 id="delete-education-title">Delete Education Record?</h2>
        <p>
            Are you sure you want to delete
            <strong id="delete-education-name"></strong>?
        </p>
        
        <div class="education-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-education-modal"
                    popovertargetaction="hide">Cancel</button>
            <button type="button" id="confirm-delete-education-btn" class="button button-danger">Ya, Delete</button>
        </div>
    </div>
</div>
